<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Marcha Brasil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 via-blue-50 to-white">
    <div class="max-w-md mx-auto pt-20 px-4">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <div class="text-6xl mb-4">🇧🇷</div>
                <h1 class="text-2xl font-bold text-gray-900 mb-2">Entrar</h1>
                <p class="text-gray-600">Acesse sua conta</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                        placeholder="seu@email.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                    <input type="password" id="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                        placeholder="••••••••">
                    <div class="mt-2">
                        <a href="/forgot-password.html" class="text-green-600 hover:text-green-800 text-sm font-medium">
                            Esqueceu a senha?
                        </a>
                    </div>
                </div>

                <div id="message" class="hidden p-4 rounded-lg text-sm"></div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-green-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-green-700 focus:ring-2 focus:ring-green-500 focus:ring-offset-2 disabled:opacity-50">
                    Entrar
                </button>
            </form>

            <div class="mt-6 text-center">
                <button id="toggleSignup" class="text-green-600 hover:text-green-800 text-sm font-medium">
                    Não tem conta? Criar conta
                </button>
            </div>
        </div>
    </div>

    <script>
        // Simple authentication system
        const supabaseUrl = 'https://xjkaqdsldkhlhjnptrga.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqa2FxZHNsZGtobGhqbnB0cmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjM0ODY5MjIsImV4cCI6MjAzOTA2MjkyMn0.ooEL_pW9nL5c5pMiJT_t-pkxEiDzcKGP5dbmz0L-z0Q';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let isSignUp = false;
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const toggleBtn = document.getElementById('toggleSignup');
        const messageDiv = document.getElementById('message');

        toggleBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            submitBtn.textContent = isSignUp ? 'Criar Conta' : 'Entrar';
            toggleBtn.textContent = isSignUp ? 'Já tem conta? Fazer login' : 'Não tem conta? Criar conta';
            document.querySelector('h1').textContent = isSignUp ? 'Criar Conta' : 'Entrar';
            document.querySelector('p').textContent = isSignUp ? 'Junte-se à comunidade' : 'Acesse sua conta';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showMessage('Por favor, preencha todos os campos.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processando...';

            try {
                let result;
                if (isSignUp) {
                    result = await supabase.auth.signUp({ email, password });
                } else {
                    result = await supabase.auth.signInWithPassword({ email, password });
                }

                if (result.error) {
                    showMessage(result.error.message || 'Erro ao processar solicitação', 'error');
                } else {
                    showMessage(isSignUp ? 'Conta criada com sucesso!' : 'Login realizado com sucesso!', 'success');
                    // Store user session
                    localStorage.setItem('marcha-brasil-user-session', JSON.stringify({
                        id: result.data.user.id,
                        email: result.data.user.email,
                        name: result.data.user.email.split('@')[0],
                        createdAt: new Date().toISOString()
                    }));
                    
                    // Redirect to home after success
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }
            } catch (error) {
                showMessage('Erro de conexão. Tente novamente.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isSignUp ? 'Criar Conta' : 'Entrar';
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `p-4 rounded-lg text-sm ${
                type === 'success' 
                    ? 'bg-green-50 text-green-800 border border-green-200' 
                    : 'bg-red-50 text-red-800 border border-red-200'
            }`;
            messageDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
