<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Marcha Brasil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 via-blue-50 to-white">
    <div class="max-w-md mx-auto pt-20 px-4">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <div class="text-6xl mb-4">📧</div>
                <h1 class="text-2xl font-bold text-gray-900 mb-2">Recuperar Senha</h1>
                <p class="text-gray-600">Digite seu email para receber o link de recuperação</p>
            </div>

            <form id="forgotForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                        placeholder="seu@email.com">
                </div>

                <div id="message" class="hidden p-4 rounded-lg text-sm"></div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-green-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-green-700 focus:ring-2 focus:ring-green-500 focus:ring-offset-2 disabled:opacity-50">
                    Enviar Link de Recuperação
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/login.html" class="text-green-600 hover:text-green-800 text-sm font-medium">
                    ← Voltar ao Login
                </a>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            const supabaseUrl = 'https://xjkaqdsldkhlhjnptrga.supabase.co';
            const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqa2FxZHNsZGtobGhqbnB0cmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjM0ODY5MjIsImV4cCI6MjAzOTA2MjkyMn0.ooEL_pW9nL5c5pMiJT_t-pkxEiDzcKGP5dbmz0L-z0Q';
            
            if (typeof supabase === 'undefined') {
                console.error('Supabase not loaded');
                showMessage('Erro ao carregar sistema de autenticação', 'error');
                return;
            }
            
            const client = supabase.createClient(supabaseUrl, supabaseKey);

            const form = document.getElementById('forgotForm');
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;

                if (!email) {
                    showMessage('Por favor, insira seu email.', 'error');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Enviando...';

                try {
                    const { error } = await client.auth.resetPasswordForEmail(email, {
                        redirectTo: `${window.location.origin}/reset-password.html`
                    });

                    if (error) {
                        showMessage(error.message || 'Erro ao enviar email de recuperação', 'error');
                    } else {
                        showMessage(`Email de recuperação enviado para ${email}! Verifique sua caixa de entrada.`, 'success');
                        // Show success state
                        setTimeout(() => {
                            document.querySelector('.bg-white').innerHTML = `
                                <div class="text-center">
                                    <div class="text-6xl mb-4">✅</div>
                                    <h2 class="text-xl font-bold text-gray-900 mb-4">Email Enviado!</h2>
                                    <p class="text-gray-600 mb-6">Verifique sua caixa de entrada e clique no link para redefinir sua senha.</p>
                                    <a href="/login.html" class="inline-block bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700">
                                        Voltar ao Login
                                    </a>
                                </div>
                            `;
                        }, 2000);
                    }
                } catch (error) {
                    console.error('Reset password error:', error);
                    showMessage('Erro de conexão. Verifique sua internet e tente novamente.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Enviar Link de Recuperação';
                }
            });

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = `p-4 rounded-lg text-sm ${
                    type === 'success' 
                        ? 'bg-green-50 text-green-800 border border-green-200' 
                        : 'bg-red-50 text-red-800 border border-red-200'
                }`;
                messageDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
